<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - STEM Asyut Deutsch Klub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="icon" type="image/png" href="../images/Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-page">
    <nav class="navbar"></nav>

    <section class="auth-hero">
        <div class="auth-hero-background">
            <img src="../images/Bg.png" alt="Background" class="bg-image">
            <div class="overlay"></div>
        </div>
        <div class="auth-hero-content">
            <h1 class="auth-hero-title">Mein <span class="gold-text">Konto</span></h1>
            <p class="auth-hero-subtitle">Your member profile — stored in the Deutsch Klub database</p>
        </div>
    </section>

    <section class="auth-section">
        <div class="account-grid">
            <div class="account-card">
                <div class="profile-header">
                    <div class="avatar-wrap" id="avatarWrap">
                        <div class="avatar-placeholder" id="avatarPlaceholder"><i class="fas fa-user"></i></div>
                        <img id="avatarImg" class="avatar-img" alt="Profile photo" hidden>
                    </div>
                    <label class="avatar-upload-label" id="avatarUploadLabel">
                        <i class="fas fa-camera"></i> Change photo
                        <input type="file" id="avatarInput" accept="image/jpeg,image/png,image/webp,image/gif">
                    </label>
                    <p class="avatar-upload-status" id="avatarStatus"></p>
                </div>
                <h2><i class="fas fa-id-card"></i> Member Profile</h2>
                <div id="profileAlert" class="auth-alert" role="alert"></div>
                <form id="profileForm" class="profile-edit-form">
                    <p class="profile-loading">Loading your profile…</p>
                </form>
                <div class="account-actions">
                    <a href="resources.html" class="btn btn-primary">Browse Resources</a>
                    <button type="button" class="btn-logout" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i> Log Out
                    </button>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer"></footer>

    
    <script type="module" src="../js/layout.js"></script>
<script type="module" src="../js/account.js"></script>
    
</body>
</html>
