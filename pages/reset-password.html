<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - STEM Asyut Deutsch Klub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="icon" type="image/png" href="../images/Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-page">
    <nav class="navbar"></nav>

    <section class="auth-hero">
        <div class="auth-hero-background">
            <img src="../images/Bg.png" alt="Background" class="bg-image">
            <div class="overlay"></div>
        </div>
        <div class="auth-hero-content">
            <h1 class="auth-hero-title">New <span class="gold-text">Password</span></h1>
            <p class="auth-hero-subtitle">Choose a strong password for your account</p>
        </div>
    </section>

    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card">
                <h2>Set New Password</h2>
                <p class="auth-subtitle">Complete your password reset</p>
                <div id="invalidLinkBox" class="auth-alert visible error" hidden>
                    This reset link is invalid or expired. Please request a new one from the forgot password page.
                </div>
                <div id="authAlert" class="auth-alert" role="alert"></div>
                <form id="resetPasswordForm" class="auth-form">
                    <div class="form-group">
                        <label for="password">New Password</label>
                        <div class="password-field-wrap">
                            <input type="password" id="password" name="password" placeholder="Strong password" required autocomplete="new-password" minlength="8">
                            <button type="button" class="password-toggle-btn" data-toggle-password="password" aria-label="Show password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-strength" id="passwordStrength" aria-hidden="true">
                            <span class="password-strength-segment"></span>
                            <span class="password-strength-segment"></span>
                            <span class="password-strength-segment"></span>
                            <span class="password-strength-segment"></span>
                            <span class="password-strength-segment"></span>
                        </div>
                        <p class="field-hint" id="passwordHint">Use 8+ characters with upper & lower case, a number, and a symbol.</p>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="password-field-wrap">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat password" required autocomplete="new-password" minlength="8">
                            <button type="button" class="password-toggle-btn" data-toggle-password="confirmPassword" aria-label="Show password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="auth-submit" id="resetSubmit">
                        <i class="fas fa-key"></i> Set New Password
                    </button>
                </form>
                <p class="auth-switch"><a href="forgot-password.html">Request a new link</a> · <a href="login.html">Sign In</a></p>
            </div>
        </div>
    </section>

    <footer class="footer"></footer>

    
    <script type="module" src="../js/layout.js"></script>
<script type="module" src="../js/reset-password.js"></script>
    
</body>
</html>
