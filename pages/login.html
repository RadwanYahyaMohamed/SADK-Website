<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - STEM Asyut Deutsch Klub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="icon" type="image/png" href="../images/Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-page">
    <nav class="navbar"></nav>

    <section class="auth-hero">
        <div class="auth-hero-background">
            <img src="../images/Bg.png" alt="Background" class="bg-image">
            <div class="overlay"></div>
        </div>
        <div class="auth-hero-content">
            <h1 class="auth-hero-title">Willkommen <span class="gold-text">zurück</span></h1>
            <p class="auth-hero-subtitle">Sign in to access your Deutsch Klub member account</p>
        </div>
    </section>

    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card">
                <h2>Sign In</h2>
                <p class="auth-subtitle">Enter your email and password</p>
                <div id="authAlert" class="auth-alert" role="alert"></div>
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-field-wrap">
                            <input type="password" id="password" name="password" placeholder="Your password" required autocomplete="current-password" minlength="8">
                            <button type="button" class="password-toggle-btn" data-toggle-password="password" aria-label="Show password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <p class="auth-form-meta">
                        <a href="forgot-password.html">Forgot your password?</a>
                    </p>
                    <button type="submit" class="auth-submit" id="loginSubmit">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>
                </form>
                <p class="auth-switch">Don't have an account? <a href="signup.html">Create one</a></p>
            </div>
        </div>
    </section>

    <footer class="footer"></footer>

    
    <script type="module" src="../js/layout.js"></script>
<script type="module" src="../js/login.js"></script>
    
</body>
</html>
