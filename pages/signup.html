<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - STEM Asyut Deutsch Klub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="icon" type="image/png" href="../images/Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-page">
    <nav class="navbar"></nav>

    <section class="auth-hero">
        <div class="auth-hero-background">
            <img src="../images/Bg.png" alt="Background" class="bg-image">
            <div class="overlay"></div>
        </div>
        <div class="auth-hero-content">
            <h1 class="auth-hero-title">Join the <span class="gold-text">Klub</span></h1>
            <p class="auth-hero-subtitle">Create your member account — your profile is saved securely in our database</p>
        </div>
    </section>

    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card">
                <h2>Create Account</h2>
                <p class="auth-subtitle">Register as a Deutsch Klub member</p>
                <div id="authAlert" class="auth-alert" role="alert"></div>
                <form id="signupForm" class="auth-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Your name" required autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="grade">Grade</label>
                        <select id="grade" name="grade" required>
                            <option value="">Select your grade</option>
                            <option value="G10">G10</option>
                            <option value="G11">G11</option>
                            <option value="G12">G12</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-field-wrap">
                            <input type="password" id="password" name="password" placeholder="Strong password" required autocomplete="new-password" minlength="8">
                            <button type="button" class="password-toggle-btn" data-toggle-password="password" aria-label="Show password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-strength" id="passwordStrength" aria-hidden="true">
                            <span class="password-strength-segment"></span>
                            <span class="password-strength-segment"></span>
                            <span class="password-strength-segment"></span>
                            <span class="password-strength-segment"></span>
                            <span class="password-strength-segment"></span>
                        </div>
                        <p class="field-hint" id="passwordHint">Use 8+ characters with upper & lower case, a number, and a symbol.</p>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="password-field-wrap">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat password" required autocomplete="new-password" minlength="8">
                            <button type="button" class="password-toggle-btn" data-toggle-password="confirmPassword" aria-label="Show password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group form-group-terms">
                        <label class="terms-label">
                            <input type="checkbox" id="terms" name="terms" required>
                            <span>I agree to use this account for Deutsch Klub learning purposes and keep my login secure.</span>
                        </label>
                    </div>
                    <button type="submit" class="auth-submit" id="signupSubmit">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </form>
                <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
            </div>
        </div>
    </section>

    <footer class="footer"></footer>

    
    <script type="module" src="../js/layout.js"></script>
<script type="module" src="../js/signup.js"></script>
    
</body>
</html>
