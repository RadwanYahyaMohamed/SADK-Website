<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - STEM Asyut Deutsch Klub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="icon" type="image/png" href="../images/Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-page">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="../images/Logo.png" alt="Deutsch Klub Logo" class="logo-img">
                <span class="logo-text">STEM Asyut Deutsch Klub</span>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li class="nav-item"><a href="../index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="login.html" class="nav-link">Login</a></li>
                <li class="nav-item"><a href="signup.html" class="nav-link">Sign Up</a></li>
            </ul>
            <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
        </div>
    </nav>

    <section class="auth-hero">
        <div class="auth-hero-background">
            <img src="../images/Bg.png" alt="Background" class="bg-image">
            <div class="overlay"></div>
        </div>
        <div class="auth-hero-content">
            <h1 class="auth-hero-title">Reset <span class="gold-text">Password</span></h1>
            <p class="auth-hero-subtitle">We will send a secure link to your email</p>
        </div>
    </section>

    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card">
                <h2>Forgot Password</h2>
                <p class="auth-subtitle">Enter the email you used to register</p>
                <div id="authAlert" class="auth-alert" role="alert"></div>
                <form id="forgotPasswordForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                    </div>
                    <button type="submit" class="auth-submit" id="forgotSubmit">
                        <i class="fas fa-paper-plane"></i> Send Reset Link
                    </button>
                </form>
                <p class="auth-switch"><a href="login.html">Back to Sign In</a></p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 SADK - STEM Asyut Deutsch Klub. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/forgot-password.js"></script>
</body>
</html>
